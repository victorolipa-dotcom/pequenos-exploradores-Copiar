 return '<footer class="container footer"><div>'+Brand()+'<p>Aprender es una aventura.</p><p>Producto digital en PDF · A4 y Carta</p></div><div class="footer-info"><p class="seller-information">'+(config.seller.legalName?esc(config.seller.legalName)+(config.seller.document?' · '+esc(config.seller.document):''):'Identificación del vendedor: pendiente de confirmar.')+'</p><p>'+(config.seller.supportEmail?'<a href="mailto:'+esc(config.seller.supportEmail)+'">'+esc(config.seller.supportEmail)+'</a>':'Contacto de soporte: pendiente de confirmar.')+'</p><div class="policy-links">'+PolicyLinks()+'</div>'+(!live?(checkoutRedirectFor('esencial')?'<p class="footer-preview">Vista previa del sitio. Los kits abren Hotmart para consultar las condiciones y completar el pago.</p>':'<p class="footer-preview">Vista previa. Pago y entrega no habilitados.</p>'):'')+'</div></footer>';
}

function Dialog()        {return '<dialog id="viewer" aria-labelledby="dialog-title" aria-describedby="dialog-description"><div class="dialog-top"><div><p class="eyebrow" id="dialog-eyebrow"></p><h2 id="dialog-title"></h2></div><button class="icon-button" id="close-dialog" aria-label="Cerrar vista">'+icon('close')+'</button></div><p id="dialog-description"></p><div id="dialog-body"></div><div class="viewer-controls" id="sample-controls"><button class="button outline small" id="previous-sample" aria-label="Ficha anterior">← Anterior</button><span id="sample-position" aria-live="polite"></span><button class="button outline small" id="next-sample" aria-label="Ficha siguiente">Siguiente →</button></div></dialog>';}






                                       
document.querySelector('#app') .innerHTML=Header()+'<main id="contenido">'+Hero()+Clarity()+SampleGallery()+HowItWorks()+Benefits()+SkillAreas()+PricingComparison()+FAQ()+Closing()+'</main>'+Footer()+Dialog()+MobileKitsCTA();
const dialog=document.querySelector                   ('#viewer') ;
const body=document.querySelector                ('#dialog-body') ;
const controls=document.querySelector                ('#sample-controls') ;
let lastFocus                 =null;
let currentSample=0;
let galleryOpen=false;
let orderKit      ='esencial';
function open(title       ,description       ,eyebrow       ,content       ,gallery=false)      {
 galleryOpen=gallery;
 document.querySelector('#dialog-title') .textContent=title;
 document.querySelector('#dialog-description') .textContent=description;
 document.querySelector('#dialog-eyebrow') .textContent=eyebrow;
 body.innerHTML=content;controls.hidden=!gallery;
 dialog.classList.toggle('sample-dialog',gallery);
 if(!dialog.open){
  lastFocus=document.activeElement               ;
  dialog.showModal();document.body.classList.add('modal-open');syncMobileCta();
  document.querySelector                   ('#close-dialog') .focus();
 }
}
function showSample(index       )      {
 currentSample=(index+samples.length)%samples.length;
 const s=samples[currentSample];
 open(s.title,s.description+' Vista de una ficha real del material.','MUESTRA REAL · PÁGINA COMPLETA','<a href="assets/atividade-'+s.id+'.webp" target="_blank" rel="noopener" aria-label="Abrir ficha en una pestaña para ampliar"><img class="full-sample" src="assets/atividade-'+s.id+'.webp" width="1072" height="1516" alt="'+esc(s.title)+': ficha completa del material."></a><p class="micro center">Toca la ficha para abrirla y ampliar. Muestra seleccionada; no incluye el producto completo.</p>',true);
 document.querySelector('#sample-position') .textContent=(currentSample+1)+' de '+samples.length;
 track('sample_view',{sample:s.id});
}
function showKit(id       )      {
 if(!config.kits.some(k=>k.id===id))return;
 orderKit=id         ;
 const q=quoteOrder(id),url=checkoutFor(id);
 const receipt='<div class="order-receipt"><h3>Resumen de la oferta</h3><dl><div><dt>'+esc(q.kit.name)+'</dt><dd>'+formatPrice(q.baseCents)+'</dd></div><div><dt>'+q.bonuses.length+' bonos incluidos</dt><dd>Sin costo adicional</dd></div><div class="order-total"><dt>Total</dt><dd>'+formatPrice(q.totalCents)+'</dd></div></dl><p>Importes en USD, antes de eventuales tributos informados por la plataforma. Los bonos no añaden ningún cargo.</p></div>';
 open('Tu kit y sus bonos incluidos.','Los bonos de esta oferta se incluyen automáticamente. No necesitas marcar casillas ni añadir productos.',salesEnabled()?'RESUMEN DE LA OFERTA':'VISTA PREVIA DE LA OFERTA · SIN COBRO','<div class="order-review bonus-order-review"><div class="order-review-kit"><img src="'+esc(q.kit.cover)+'" width="1072" height="1516" alt="Portada de '+esc(q.kit.name)+'"><div><h3>'+esc(q.kit.name)+'</h3><p>'+formatCount(q.kitActivities)+' actividades del kit + '+q.bonuses.length+' bonos de regalo</p><p><strong>'+formatCount(q.contentTotal)+' actividades y propuestas</strong>, considerando los bonos.</p><p>PDF en A4 y Carta · Sin envío físico</p></div></div>'+receipt+BonusList(id,'dialog')+'<div class="order-actions"><button class="button" data-proceed-payment '+(!url?'disabled':'')+'>'+(url?'Ir al pago':'Pago no disponible en esta vista previa')+'</button><button class="text-link" data-close-offer>Volver a los kits</button></div><p class="payment-facts">Pago único · Producto digital · Sin envío físico</p>'+(!url?'<p class="preview-inline">Vista previa: no se ha realizado ninguna compra. El acceso al kit con todos sus bonos se habilitará cuando la entrega esté configurada y verificada.</p>':'')+'</div>');
 track('offer_preview',{kit:id});
}
document.addEventListener('click',event=>{
 const target=(event.target           ).closest             ('button,a');if(!target)return;
 if(target.id==='toggle-more-questions'){
  const expanded=target.getAttribute('aria-expanded')==='true';
  target.setAttribute('aria-expanded',String(!expanded));
  document.querySelector             ('#more-questions') .hidden=expanded;
  target.innerHTML=(expanded?'Ver más preguntas':'Ver menos preguntas')+' '+icon('chevron');
 }
 if(target.dataset.sample!==undefined)showSample(Number(target.dataset.sample));
 if(target.dataset.kit)showKit(target.dataset.kit);
 if(target.hasAttribute('data-proceed-payment')){const url=checkoutFor(orderKit);if(url)window.location.assign(url);}
 if(target.hasAttribute('data-close-offer'))dialog.close();
 if(target.matches('.faq-item button')){
  const expanded=target.getAttribute('aria-expanded')==='true';
  target.setAttribute('aria-expanded',String(!expanded));
  document.getElementById(target.getAttribute('aria-controls') ) .hidden=expanded;
 }
});
document.querySelector('#close-dialog') .addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
dialog.addEventListener('close',()=>{document.body.classList.remove('modal-open');galleryOpen=false;lastFocus?.focus({preventScroll:true});});
dialog.addEventListener('keydown',e=>{if(!galleryOpen)return;if(e.key==='ArrowRight'){e.preventDefault();showSample(currentSample+1);}if(e.key==='ArrowLeft'){e.preventDefault();showSample(currentSample-1);}});
document.querySelector('#previous-sample') .addEventListener('click',()=>showSample(currentSample-1));
document.querySelector('#next-sample') .addEventListener('click',()=>showSample(currentSample+1));
if(config.mode==='live'&&!salesEnabled())console.error('Configuração comercial incompleta: vendas bloqueadas.');


// Mobile CTA: only after the hero, never over purchase buttons, dialogs, footer or bottom controls.
const mobileBar=document.querySelector                ('#mobile-kits-cta') ;
const mobileQuery=window.matchMedia('(max-width:760px)');
let mobileFrame=0;
function visibleInViewport(el        )         {
 const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.bottom>0&&r.top<window.innerHeight;
}
function syncMobileCta()      {
 if(!mobileBar)return;
 const hero=document.querySelector('#inicio') ,footer=document.querySelector('footer') ;
 const purchaseVisible=[...document.querySelectorAll('.offer-buy-button')].some(visibleInViewport);
 const blocked=[...document.querySelectorAll('a,button,input,summary,[role="alert"],[data-privacy-notice]')].some(el=>{
  if(mobileBar.contains(el))return false;
  const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.bottom>window.innerHeight-90&&r.top<window.innerHeight;
 });
 const show=mobileQuery.matches&&!dialog.open&&!document.querySelector('.fancybox-container')&&!visibleInViewport(hero)&&!visibleInViewport(footer)&&!purchaseVisible&&!blocked;
 mobileBar.hidden=!show;
}
function scheduleMobileCta()      {
 if(mobileFrame)return;
 mobileFrame=requestAnimationFrame(()=>{mobileFrame=0;syncMobileCta();});
}
window.addEventListener('scroll',scheduleMobileCta,{passive:true});
window.addEventListener('resize',scheduleMobileCta);
mobileQuery.addEventListener('change',scheduleMobileCta);
dialog.addEventListener('close',scheduleMobileCta);
document.addEventListener('click',scheduleMobileCta);
new ResizeObserver(scheduleMobileCta).observe(document.querySelector('main') );
syncMobileCta();


// Sample carousel: retain three full-size cards per page, never shrink six cards into one row.
const sampleCarousel=document.querySelector             ('#sample-carousel') ;
const sampleGroups=[...document.querySelectorAll             ('.sample-group')];
const rotationButton=document.querySelector                   ('#toggle-sample-rotation') ;
const samplePageStatus=document.querySelector             ('#sample-page-status') ;
const carouselDesktop=window.matchMedia('(min-width:1024px)');
const reducedMotion=window.matchMedia('(prefers-reduced-motion:reduce)');
let samplePage=0;
let rotationEnabled=carouselDesktop.matches&&!reducedMotion.matches;
let rotationInteracted=false;
let carouselInView=false;
let carouselHovered=false;
function updateRotationControl()      {
 rotationButton.textContent=rotationEnabled?'Pausar cambio automático':'Activar cambio automático';
}
function changeSamplePage(index       ,manual=false)      {
 if(manual){rotationInteracted=true;rotationEnabled=false;updateRotationControl();}
 const focusInGroup=sampleGroups.some(g=>g.contains(document.activeElement));
 samplePage=(index+sampleGroups.length)%sampleGroups.length;
 sampleGroups.forEach((group,i)=>group.hidden=i!==samplePage);
 document.querySelectorAll             ('[data-sample-page]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.samplePage)===samplePage)));
 samplePageStatus.setAttribute('aria-live',manual?'polite':'off');
 samplePageStatus.textContent=(samplePage*3+1)+'–'+Math.min((samplePage+1)*3,samples.length)+' de '+samples.length;
 if(manual&&focusInGroup)document.querySelector                   ('#next-samples') .focus();
 scheduleMobileCta();
}
document.querySelector('#previous-samples') .addEventListener('click',()=>changeSamplePage(samplePage-1,true));
document.querySelector('#next-samples') .addEventListener('click',()=>changeSamplePage(samplePage+1,true));
document.querySelectorAll             ('[data-sample-page]').forEach(b=>b.addEventListener('click',()=>changeSamplePage(Number(b.dataset.samplePage),true)));
rotationButton.addEventListener('click',()=>{rotationInteracted=true;rotationEnabled=!rotationEnabled;updateRotationControl();});
sampleCarousel.addEventListener('mouseenter',()=>carouselHovered=true);
sampleCarousel.addEventListener('mouseleave',()=>carouselHovered=false);
sampleCarousel.addEventListener('focusin',event=>{if(event.target!==rotationButton){rotationInteracted=true;rotationEnabled=false;updateRotationControl();}});
sampleCarousel.addEventListener('keydown',event=>{
 if(event.key==='ArrowRight'){event.preventDefault();changeSamplePage(samplePage+1,true);}
 if(event.key==='ArrowLeft'){event.preventDefault();changeSamplePage(samplePage-1,true);}
});
carouselDesktop.addEventListener('change',()=>{if(!rotationInteracted)rotationEnabled=carouselDesktop.matches&&!reducedMotion.matches;updateRotationControl();});
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){rotationEnabled=false;updateRotationControl();}});
new IntersectionObserver(entries=>{carouselInView=entries[0].intersectionRatio>=0.25;},{threshold:[0,0.25]}).observe(sampleCarousel);
setInterval(()=>{
 if(rotationEnabled&&carouselInView&&!carouselHovered&&!document.hidden&&!dialog.open&&!document.querySelector('.fancybox-container')&&!sampleCarousel.contains(document.activeElement))changeSamplePage(samplePage+1);
},7000);
updateRotationControl();

// Official Hotmart widget; the styled HTML link remains usable if the widget is unavailable.
if(config.kits.some(k=>hotmartWidgetEnabledFor(k.id))){
 const widget=config.checkout.widget ;
 const links=[...document.querySelectorAll                   ('a[data-checkout-kit]')].map(link=>({
  current:link,parent:link.parentElement ,next:link.nextSibling,fallback:link.cloneNode(true)                     
 }));
 const boundLinks=new WeakSet                   ();
                                                                                                     
 function bindAvailableWidget()         {
  const vendor=(window                                      ).jQuery;
  if(!vendor?.fn?.fancybox)return false;
  const mobile=/Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent)||window.innerWidth<=760;
  if(mobile)return true;
  for(const record of links){
   if(record.current.isConnected&&!boundLinks.has(record.current)){
    vendor(record.current).fancybox({type:'iframe',toolbar:false,smallBtn:true,iframe:{css:{width:'600px'},attr:{allowpaymentrequest:'true',title:'Checkout de Hotmart — Kit Esencial'}}});
    boundLinks.add(record.current);
   }
  }
  return true;
 }
 const widgetObserver=new MutationObserver(()=>{
  for(const record of links){
   if(!record.current.isConnected&&record.parent.isConnected){
    const fallback=record.fallback.cloneNode(true)                     ;
    record.parent.insertBefore(fallback,record.next?.parentNode===record.parent?record.next:null);
    record.current=fallback;
   }
  }
  bindAvailableWidget();
  document.querySelectorAll                   ('.fancybox-iframe').forEach(frame=>{
   if(!frame.title)frame.title='Checkout de Hotmart — Kit Esencial';
  });
  document.querySelectorAll                   ('.fancybox-close-small').forEach(button=>{
   if(!button.getAttribute('aria-label'))button.setAttribute('aria-label','Cerrar checkout');
  });
  scheduleMobileCta();
 });
 widgetObserver.observe(document.body,{childList:true,subtree:true});
 if(!document.getElementById('hotmart-widget-css')){
  const css=document.createElement('link');css.id='hotmart-widget-css';css.rel='stylesheet';css.type='text/css';css.href=widget.styleUrl;document.head.appendChild(css);
 }
 if(!document.getElementById('hotmart-widget-js')){
  const js=document.createElement('script');js.id='hotmart-widget-js';js.type='text/javascript';js.src=widget.scriptUrl;js.async=true;document.head.appendChild(js);
 }
 let widgetChecks=0;
 const readyCheck=setInterval(()=>{
  widgetChecks++;
  if(bindAvailableWidget()||widgetChecks>=60)clearInterval(readyCheck);
 },250);
}
